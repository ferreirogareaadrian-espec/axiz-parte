<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="robots" content="noindex, nofollow">
<title>AXIZ · EL DESPACHO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse 90% 50% at 50% 0%,#12120c,#06060a 70%);
color:#f4f4f8;font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
#puerta{max-width:420px;margin:14vh auto 0;padding:0 22px;text-align:center}
#puerta .escudo-caja{margin:0 auto 26px;text-align:center}
#puerta .escudo-caja img{width:150px;height:auto;display:inline-block;filter:drop-shadow(0 0 22px rgba(224,177,58,.25))}
#puerta h1{font-family:ui-monospace,monospace;font-size:13px;letter-spacing:5px;color:#e0b13a}
#puerta .s{font-family:ui-monospace,monospace;font-size:8px;letter-spacing:2px;color:#8e8ea6;margin-top:10px}
#puerta form{margin-top:30px;display:flex;gap:9px}
#puerta input{flex:1;background:#0d0c09;border:1px solid #3a3426;border-radius:9px;color:#f4f4f8;
font-family:ui-monospace,monospace;font-size:15px;letter-spacing:3px;padding:13px 16px;outline:none;text-align:center}
#puerta input:focus{border-color:#e0b13a}
#puerta button{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:2px;background:#e0b13a;
color:#0a0805;border:none;border-radius:9px;padding:0 20px;cursor:pointer;font-weight:700}
#aviso{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:1px;color:#e06050;margin-top:14px;min-height:14px}
#puerta .pie{font-family:ui-monospace,monospace;font-size:7px;letter-spacing:1.5px;color:#5a5648;margin-top:34px;line-height:1.8}
#cargando{display:none;position:fixed;inset:0;z-index:99;flex-direction:column;align-items:center;justify-content:center;
background:radial-gradient(ellipse 90% 50% at 50% 40%,#12120c,#06060a 75%)}
#cargando{opacity:0;transition:opacity .5s ease}
#cargando.visible{opacity:1}
#cargando .sello{display:none}
@keyframes giraEscudo{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
#cargando .ct{margin-top:26px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:3.5px;color:#c9a84a}
#cargando .cb{width:150px;height:2px;background:rgba(224,177,58,.14);margin-top:14px;overflow:hidden;border-radius:2px}
#cargando .cb i{display:block;height:100%;width:40%;background:#e0b13a;border-radius:2px;animation:cbCorre 1.1s ease-in-out infinite}
@keyframes cbCorre{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){#cargando .sello,#cargando .cb i{animation:none}}
#sala{display:none;height:100vh;flex-direction:column}
#sala header{border-bottom:1px solid #2e2b20;padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sala header .t{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:3px;color:#e0b13a;margin-right:8px}
#sala header button{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:1px;color:#c9a84a;
background:rgba(224,177,58,.05);border:1px solid #3a3426;border-radius:12px;padding:7px 12px;cursor:pointer}
#sala header button.on{background:#e0b13a;color:#0a0805;font-weight:700;border-color:#e0b13a}
#sala header a.chat{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:1px;
color:#0a0805;background:#e0b13a;border:1px solid #e0b13a;border-radius:12px;padding:7px 12px;
text-decoration:none;font-weight:700}
#sala header a.chat:hover{background:#e8bd4a}
#sala header .salir{margin-left:auto;color:#8e8ea6}
#lienzo{flex:1;border:none;width:100%;background:#06060a}
#ausentes{font-family:ui-monospace,monospace;font-size:8px;color:#8a7a4a;padding:4px 18px}
#tele{display:none;flex:1;flex-direction:column;background:#06060a}
#tvbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid #2e2b20}
#tvbar button{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:1px;color:#c9a84a;
background:rgba(224,177,58,.05);border:1px solid #3a3426;border-radius:12px;padding:7px 12px;cursor:pointer}
#tvbar button.on{background:#e0b13a;color:#0a0805;font-weight:700;border-color:#e0b13a}
#tvbar .nota{font-family:ui-monospace,monospace;font-size:7.5px;color:#6f6850;align-self:center;margin-left:auto}
#tvf{flex:1;border:none;width:100%;background:#000}
#minis{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:60}
.mini{width:300px;max-width:44vw;background:#000;border:1px solid #3a3426;border-radius:8px;
overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.55);cursor:pointer}
.mini .mh{display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,monospace;
font-size:7.5px;letter-spacing:1.5px;color:#c9a84a;background:#12100b;padding:4px 8px}
.mini .mh i{font-style:normal;color:#6f6850;padding:0 3px}
.mini .mh i:hover{color:#e06050}
.mini iframe{width:100%;aspect-ratio:16/9;border:0;display:block;pointer-events:none}
</style></head><body>

function abrir(d){

document.getElementById('puerta').style.display='none';

var tabs=document.getElementById('tabs');

function pintar(d,i){
document.getElementById('tele').style.display='none';
document.getElementById('minis').style.display='flex';
document.getElementById('lienzo').style.display='block';
document.getElementById('btnTele').classList.remove('on');
document.querySelectorAll('#tabs button').forEach(function(b,j){b.classList.toggle('on',j===i);});

function abreTeleGrande(i){
document.getElementById('lienzo').style.display='none';
document.getElementById('minis').style.display='none';
document.querySelectorAll('#tabs button').forEach(function(b){b.classList.remove('on');});

function montarTele(){
