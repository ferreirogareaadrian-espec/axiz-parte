function b64a(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();
var clave=document.getElementById('clave').value;if(!clave)return;
var aviso=document.getElementById('aviso');aviso.textContent='ABRIENDO\u2026';
var enc=new TextEncoder();
crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveKey'])
.then(function(k){return crypto.subtle.deriveKey(
{name:'PBKDF2',salt:b64a(SAL),iterations:VUELTAS,hash:'SHA-256'},k,
{name:'AES-GCM',length:256},false,['decrypt']);})
.then(function(llave){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64a(NONCE)},llave,b64a(COFRE));})
.then(function(plano){var d=JSON.parse(new TextDecoder().decode(plano));abrir(d);})
.catch(function(){aviso.textContent='CLAVE INCORRECTA';});});
function abrir(d){
document.getElementById('puerta').style.display='none';
var sala=document.getElementById('sala');sala.style.display='flex';
var tabs=document.getElementById('tabs');
d.laminas.forEach(function(L,i){var b=document.createElement('button');b.textContent=L.titulo;
b.addEventListener('click',function(){pintar(d,i);});tabs.appendChild(b);});
if(d.ausentes&&d.ausentes.length){document.getElementById('ausentes').textContent=
'Hoy sin l\u00e1mina (declarado): '+d.ausentes.join(' \u00b7 ');}
if(d.laminas.length){pintar(d,0);}}
function pintar(d,i){
document.querySelectorAll('#tabs button').forEach(function(b,j){b.classList.toggle('on',j===i);});
document.getElementById('lienzo').setAttribute('srcdoc',d.laminas[i].html);}
</script></body></html>
