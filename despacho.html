document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();

var aviso=document.getElementById('aviso');aviso.textContent='ABRIENDO\u2026';
var enc=new TextEncoder();
crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveKey'])
.then(function(k){return crypto.subtle.deriveKey(
{name:'PBKDF2',salt:b64a(SAL),iterations:VUELTAS,hash:'SHA-256'},k,
{name:'AES-GCM',length:256},false,['decrypt']);})
.then(function(llave){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64a(NONCE)},llave,b64a(COFRE));})
.then(function(plano){var d=JSON.parse(new TextDecoder().decode(plano));abrir(d);})
.catch(function(){aviso.textContent='CLAVE INCORRECTA';});});

function abrir(d){
document.getElementById('puerta').style.display='none';
var sala=document.getElementById('sala');sala.style.display='flex';
var tabs=document.getElementById('tabs');
d.laminas.forEach(function(L,i){var b=document.createElement('button');b.textContent=L.titulo;
b.addEventListener('click',function(){pintar(d,i);});tabs.appendChild(b);});
if(d.ausentes&&d.ausentes.length){document.getElementById('ausentes').textContent=
'Hoy sin l\u00e1mina (declarado): '+d.ausentes.join(' \u00b7 ');}
montarTele();
if(d.laminas.length){pintar(d,0);}}
function pintar(d,i){
document.getElementById('tele').style.display='none';
document.getElementById('minis').style.display='flex';
document.getElementById('lienzo').style.display='block';
document.getElementById('btnTele').classList.remove('on');
document.querySelectorAll('#tabs button').forEach(function(b,j){b.classList.toggle('on',j===i);});
document.getElementById('lienzo').setAttribute('srcdoc',d.laminas[i].html);}
function abreTeleGrande(i){
document.getElementById('lienzo').style.display='none';
document.getElementById('minis').style.display='none';
document.querySelectorAll('#tabs button').forEach(function(b){b.classList.remove('on');});
document.getElementById('btnTele').classList.add('on');
document.getElementById('tele').style.display='flex';
sintoniza(i);}
function montarTele(){
var bar=document.getElementById('tvbar');
CANALES.forEach(function(c,i){var b=document.createElement('button');b.textContent=c.nombre;
b.addEventListener('click',function(){sintoniza(i);});bar.appendChild(b);});
var n=document.createElement('span');n.className='nota';
n.textContent='si un canal no carga: no permite incrustar o no est\u00e1 en directo \u2014 prueba otro';
bar.appendChild(n);
var minis=document.getElementById('minis');
CANALES.forEach(function(c,i){
var d=document.createElement('div');d.className='mini';
var h=document.createElement('div');h.className='mh';
var s=document.createElement('span');s.textContent=c.nombre+' \u00b7 tocar para ampliar';
var x=document.createElement('i');x.textContent='\u2715';x.title='esconder';
x.addEventListener('click',function(ev){ev.stopPropagation();d.style.display='none';});
h.appendChild(s);h.appendChild(x);
var f=document.createElement('iframe');
f.setAttribute('allow','autoplay; encrypted-media');f.setAttribute('title',c.nombre);
f.setAttribute('src',c.url);
d.appendChild(h);d.appendChild(f);
d.addEventListener('click',function(){abreTeleGrande(i);});
minis.appendChild(d);});
document.getElementById('btnTele').addEventListener('click',function(){abreTeleGrande(0);});}
function sintoniza(i){
document.querySelectorAll('#tvbar button').forEach(function(b,j){b.classList.toggle('on',j===i);});
document.getElementById('tvf').setAttribute('src',CANALES[i].url);}
